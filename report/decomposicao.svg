<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- A: row strips -->
  <text x="90" y="22" text-anchor="middle" font-weight="bold">A (N×N)</text>
  <rect x="30" y="35" width="120" height="30" fill="#2a78d6" fill-opacity="0.85"/>
  <rect x="30" y="65" width="120" height="30" fill="#e8663a" fill-opacity="0.85"/>
  <rect x="30" y="95" width="120" height="30" fill="#1baf7a" fill-opacity="0.85"/>
  <rect x="30" y="125" width="120" height="30" fill="#8a5cc9" fill-opacity="0.85"/>
  <rect x="30" y="35" width="120" height="120" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="55" text-anchor="middle" fill="#fff">P0</text>
  <text x="90" y="85" text-anchor="middle" fill="#fff">P1</text>
  <text x="90" y="115" text-anchor="middle" fill="#fff">P2</text>
  <text x="90" y="145" text-anchor="middle" fill="#fff">P3</text>
  <text x="90" y="180" text-anchor="middle">MPI_Scatterv:</text>
  <text x="90" y="197" text-anchor="middle">cada processo recebe</text>
  <text x="90" y="214" text-anchor="middle">a sua faixa de linhas</text>

  <text x="185" y="100" text-anchor="middle" font-size="24">×</text>

  <!-- B: replicated -->
  <text x="280" y="22" text-anchor="middle" font-weight="bold">B (N×N)</text>
  <rect x="220" y="35" width="120" height="120" fill="#9aa3ad" fill-opacity="0.55" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="92" text-anchor="middle">inteira</text>
  <text x="280" y="109" text-anchor="middle">em todos</text>
  <text x="280" y="180" text-anchor="middle">MPI_Bcast:</text>
  <text x="280" y="197" text-anchor="middle">todos recebem B</text>
  <text x="280" y="214" text-anchor="middle">(N² floats por processo)</text>

  <text x="375" y="100" text-anchor="middle" font-size="24">=</text>

  <!-- C: row strips -->
  <text x="470" y="22" text-anchor="middle" font-weight="bold">C (N×N)</text>
  <rect x="410" y="35" width="120" height="30" fill="#2a78d6" fill-opacity="0.85"/>
  <rect x="410" y="65" width="120" height="30" fill="#e8663a" fill-opacity="0.85"/>
  <rect x="410" y="95" width="120" height="30" fill="#1baf7a" fill-opacity="0.85"/>
  <rect x="410" y="125" width="120" height="30" fill="#8a5cc9" fill-opacity="0.85"/>
  <rect x="410" y="35" width="120" height="120" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="55" text-anchor="middle" fill="#fff">P0</text>
  <text x="470" y="85" text-anchor="middle" fill="#fff">P1</text>
  <text x="470" y="115" text-anchor="middle" fill="#fff">P2</text>
  <text x="470" y="145" text-anchor="middle" fill="#fff">P3</text>
  <text x="470" y="180" text-anchor="middle">conta local sem</text>
  <text x="470" y="197" text-anchor="middle">comunicação; depois</text>
  <text x="470" y="214" text-anchor="middle">MPI_Gatherv no P0</text>

  <text x="320" y="255" text-anchor="middle" fill="#444">Exemplo com P = 4. Se N mod P ≠ 0, as primeiras faixas recebem uma linha a mais.</text>
</svg>
